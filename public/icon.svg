<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="eh-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#196547"/>
      <stop offset="100%" stop-color="#0c3825"/>
    </linearGradient>
    <linearGradient id="eh-top" x1="6.5" y1="8.5" x2="25.5" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3dd69b"/>
      <stop offset="100%" stop-color="#249c69"/>
    </linearGradient>
    <linearGradient id="eh-left" x1="6.5" y1="13.75" x2="16" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e7854"/>
      <stop offset="100%" stop-color="#15583d"/>
    </linearGradient>
    <linearGradient id="eh-arrow" x1="9" y1="22" x2="25" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8ed99"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="eh-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#eh-bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#d8ed99" stroke-opacity="0.25" stroke-width="1"/>

  <!-- 3D Courier Parcel -->
  <!-- Left Face -->
  <polygon points="6.5,13.75 16,19 16,27 6.5,21.75" fill="url(#eh-left)"/>
  <!-- Right Face (Shadow) -->
  <polygon points="16,19 25.5,13.75 25.5,21.75 16,27" fill="#0d3f2b"/>
  <!-- Top Face (Lid) -->
  <polygon points="16,8.5 25.5,13.75 16,19 6.5,13.75" fill="url(#eh-top)"/>

  <!-- Box Seam/Tape detail on top -->
  <line x1="11.25" y1="11.125" x2="20.75" y2="16.375" stroke="#d8ed99" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="16" y1="19" x2="16" y2="27" stroke="#092d1f" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Soaring Express Arrow (↗) -->
  <g filter="url(#eh-shadow)">
    <path d="M 10 22 L 21.5 10.5 M 21.5 10.5 H 16.5 M 21.5 10.5 V 15.5" stroke="url(#eh-arrow)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="22" r="1.3" fill="#d8ed99"/>
  </g>
</svg>
