<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 40" width="184" height="40" fill="none">
  <defs>
    <linearGradient id="eh-full-bg" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#196547"/>
      <stop offset="100%" stop-color="#0c3825"/>
    </linearGradient>
    <linearGradient id="eh-full-top" x1="10.5" y1="12.5" x2="29.5" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3dd69b"/>
      <stop offset="100%" stop-color="#249c69"/>
    </linearGradient>
    <linearGradient id="eh-full-left" x1="10.5" y1="17.75" x2="20" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e7854"/>
      <stop offset="100%" stop-color="#15583d"/>
    </linearGradient>
    <linearGradient id="eh-full-arrow" x1="13" y1="26" x2="29" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8ed99"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="eh-full-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Emblem at (4,4) size 32x32 -->
  <g transform="translate(4, 4)">
    <!-- Squircle Base -->
    <rect width="32" height="32" rx="7.5" fill="url(#eh-full-bg)"/>
    <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#d8ed99" stroke-opacity="0.25" stroke-width="1"/>

    <!-- 3D Courier Parcel -->
    <!-- Left Face -->
    <polygon points="6.5,13.75 16,19 16,27 6.5,21.75" fill="url(#eh-full-left)"/>
    <!-- Right Face (Shadow) -->
    <polygon points="16,19 25.5,13.75 25.5,21.75 16,27" fill="#0d3f2b"/>
    <!-- Top Face (Lid) -->
    <polygon points="16,8.5 25.5,13.75 16,19 6.5,13.75" fill="url(#eh-full-top)"/>

    <!-- Box Seam/Tape detail on top -->
    <line x1="11.25" y1="11.125" x2="20.75" y2="16.375" stroke="#d8ed99" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="16" y1="19" x2="16" y2="27" stroke="#092d1f" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- Soaring Express Arrow (↗) -->
    <g filter="url(#eh-full-shadow)">
      <path d="M 10 22 L 21.5 10.5 M 21.5 10.5 H 16.5 M 21.5 10.5 V 15.5" stroke="url(#eh-full-arrow)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="10" cy="22" r="1.3" fill="#d8ed99"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="46" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.035em">
    <tspan fill="#17372f">Express</tspan><tspan fill="#196547">Hub</tspan>
  </text>
</svg>
