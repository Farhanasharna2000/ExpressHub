name: Load test

# Manual only. Point it at a preview or staging deployment, not production,
# unless you mean to load production.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment to test, e.g. https://expresshub-git-main-you.vercel.app"
        required: true
        type: string
      tracking_number:
        description: "Optional real tracking number for the public tracking request"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate the target URL
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          if ! printf '%s' "$BASE_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/.*)?$'; then
            echo "base_url must be an https:// URL" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Run k6
        env:
          BASE_URL: ${{ inputs.base_url }}
          TRACKING_NUMBER: ${{ inputs.tracking_number }}
        run: k6 run --summary-export=k6-summary.json tests/load/smoke.js

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k6-summary
          path: k6-summary.json
          if-no-files-found: ignore
          retention-days: 14
